plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 35

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 35
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        missingDimensionStrategy 'device', 'anyDevice'
    }

    buildTypes {
        release {
            minifyEnabled true
        }
    }
    namespace 'com.hoho.android.usbserial.examples'
}

// graphics-shapes:1.0.1 (KMP umbrella) and graphics-shapes-android:1.0.1 both define
// androidx.graphics.shapes.R, causing a dex duplicate error. Exclude the KMP umbrella;
// the Android-specific artifact provides the actual implementation.
configurations.all {
    exclude group: 'androidx.graphics', module: 'graphics-shapes'
}

dependencies {
    implementation project(':usbSerialForAndroid')
    implementation 'androidx.appcompat:appcompat:1.7.1' // later versions have minsdk 21
    implementation 'com.google.android.material:material:1.14.0' // later versions have minsdk 19
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
}