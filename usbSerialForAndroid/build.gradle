plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 17
        targetSdkVersion 35
        consumerProguardFiles 'proguard-rules.pro'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments = [                    // Raspi   Windows   LinuxVM   ...
                                                                  'rfc2217_server_host': '192.168.0.78',
                                                                  'rfc2217_server_nonstandard_baudrates': 'true',   // true    false     false
        ]
    }
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    namespace 'com.hoho.android.usbserial'
    publishing {
        // if coverage is enabled, change 'release' to 'anyDeviceRelease' or comment out publishing rule
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.10.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    androidTestImplementation 'androidx.appcompat:appcompat:1.7.1' // later versions have minsdk 21
    androidTestImplementation 'androidx.test:core:1.7.0' // later versions have minsdk 19
    androidTestImplementation 'androidx.test:runner:1.7.0' // later versions have minsdk 19
    androidTestImplementation 'commons-net:commons-net:3.13.0'
    // later versions fail on old Android devices with missing java.time.Duration class
    androidTestImplementation 'org.apache.commons:commons-lang3:3.20.0'
}

// gradle task: publishToMavenLocal
project.afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                // values used for local maven repo, jitpack uses github release:
                groupId 'com.github.mik3y'
                artifactId 'usb-serial-for-android'
                version '3.8.0beta'
            }
        }
    }
}

//apply from: 'coverage.gradle'